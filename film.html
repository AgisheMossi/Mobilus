<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="Regardez vos films sur MOBILUS.">
    <title>Film | MOBILUS</title>
    <style>
        :root {
            --fond: #090909;
            --fond-secondaire: #151515;
            --rouge: #e50914;
            --jaune: #ffd400;
            --blanc: #ffffff;
            --gris: #aaaaaa;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--fond);
            color: var(--blanc);
            min-height: 100vh;
        }
        body.chargement-actif {
            overflow: hidden;
        }
        button {
            font-family: inherit;
            cursor: pointer;
        }
        /* CHARGEMENT : CERCLE JAUNE UNIQUEMENT */
        .ecran-chargement {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #090909;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease,
                        visibility 0.2s ease;
        }
        .ecran-chargement.termine {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .cercle-chargement {
            width: 48px;
            height: 48px;
            border: 4px solid #333333;
            border-top-color: #ffd400;
            border-radius: 50%;
            animation: tourner 0.8s linear infinite;
        }
        @keyframes tourner {
            to {
                transform: rotate(360deg);
            }
        }
        /* EN-TÊTE */
        .entete {
            width: 100%;
            min-height: 65px;
            padding: 14px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #090909;
            border-bottom: 1px solid #242424;
        }
        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 1px;
            color: white;
            text-decoration: none;
        }
        .logo .lettre-rouge {
            color: var(--rouge);
        }
        .bouton-retour {
            border: 1px solid #393939;
            background: #191919;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            font-size: 14px;
        }
        .bouton-retour:active {
            transform: scale(0.97);
        }
        /* CONTENU PRINCIPAL */
        .conteneur {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 18px 45px;
        }
        .etiquette {
            display: inline-block;
            color: var(--jaune);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .titre-principal {
            font-size: 28px;
            line-height: 1.3;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }
        .informations {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--gris);
            font-size: 13px;
            margin-bottom: 22px;
        }
        .informations span {
            background: #191919;
            padding: 6px 9px;
            border-radius: 5px;
        }
        /* LECTEUR VIDÉO */
        .lecteur {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid #252525;
            margin-bottom: 25px;
        }
        .lecteur iframe,
        .lecteur video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000000;
        }
        .message-video {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #bbbbbb;
            font-size: 14px;
            line-height: 1.6;
        }
        .message-video.cache {
            display: none;
        }
        /* BOUTONS */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }
        .bouton-principal,
        .bouton-favori {
            min-height: 46px;
            padding: 12px 18px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            border: none;
        }
        .bouton-principal {
            background: var(--rouge);
            color: white;
        }
        .bouton-principal:active {
            transform: scale(0.97);
        }
        .bouton-favori {
            background: #242424;
            color: white;
            border: 1px solid #393939;
        }
        .bouton-favori.actif {
            border-color: var(--jaune);
            color: var(--jaune);
        }
        /* DESCRIPTION */
        .bloc-description {
            background: var(--fond-secondaire);
            border: 1px solid #242424;
            border-radius: 10px;
            padding: 20px;
        }
        .bloc-description h2 {
            font-size: 19px;
            margin-bottom: 12px;
        }
        .description {
            font-size: 14px;
            line-height: 1.8;
            color: #c5c5c5;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }
        .erreur {
            color: #ff6b6b;
        }
        footer {
            text-align: center;
            color: #777777;
            padding: 25px 15px;
            font-size: 12px;
            border-top: 1px solid #222222;
        }
        @media (min-width: 700px) {
            .conteneur {
                padding-top: 35px;
            }
            .titre-principal {
                font-size: 36px;
            }
            .lecteur {
                margin-bottom: 30px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .cercle-chargement {
                animation-duration: 1.5s;
            }
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body class="chargement-actif">
    <!-- ÉCRAN DE CHARGEMENT -->
    <div class="ecran-chargement" id="ecranChargement">
        <div class="cercle-chargement"></div>
    </div>
    <!-- EN-TÊTE -->
    <header class="entete">
        <a href="index.html" class="logo" aria-label="Accueil MOBILUS">
            M<span class="lettre-rouge">O</span>BILUS
        </a>
        <button
            type="button"
            class="bouton-retour"
            id="boutonRetour">
            ← Retour
        </button>
    </header>
    <!-- CONTENU DU FILM -->
    <main class="conteneur">
        <span class="etiquette">TON UNIVERS CINÉMA</span>
        <h1 class="titre-principal" id="titreFilm">
            Chargement du film...
        </h1>
        <div class="informations">
            <span id="anneeFilm">Année inconnue</span>
            <span id="categorieFilm">Film</span>
            <span id="dureeFilm">Durée inconnue</span>
        </div>
        <!-- LECTEUR VIDÉO -->
        <section
            class="lecteur"
            id="videoContainer"
            aria-label="Lecteur vidéo">
            <div class="message-video" id="messageVideo">
                Préparation de la vidéo...
            </div>
        </section>
        <!-- ACTIONS -->
        <div class="actions">
            <button
                type="button"
                class="bouton-principal"
                id="boutonRegarder">
                ▶ Regarder le film
            </button>
            <button
                type="button"
                class="bouton-favori"
                id="boutonFavori">
                ♡ Ajouter aux favoris
            </button>
        </div>
        <!-- DESCRIPTION -->
        <section class="bloc-description">
            <h2>À propos du film</h2>
            <p class="description" id="descriptionFilm">
                Aucune description disponible.
            </p>
        </section>
    </main>
    <footer>
        © <span id="anneeActuelle"></span> MOBILUS —
        YOUR CINEMA, EVERYWHERE
    </footer>
    <!-- CATALOGUE DES FILMS -->
    <script src="films.js"></script>
    <script>
    (function () {
        "use strict";
        /* ======================================
           CHARGEMENT DE 2 SECONDES
        ====================================== */
        const ecranChargement =
            document.getElementById("ecranChargement");
        document.getElementById("anneeActuelle").textContent =
            new Date().getFullYear();
        setTimeout(function () {
            if (ecranChargement) {
                ecranChargement.classList.add("termine");
            }
            document.body.classList.remove("chargement-actif");
            setTimeout(function () {
                if (ecranChargement) {
                    ecranChargement.remove();
                }
            }, 250);
        }, 2000);
        /* ======================================
           RÉCUPÉRATION DES ÉLÉMENTS
        ====================================== */
        const titreFilm =
            document.getElementById("titreFilm");
        const anneeFilm =
            document.getElementById("anneeFilm");
        const categorieFilm =
            document.getElementById("categorieFilm");
        const dureeFilm =
            document.getElementById("dureeFilm");
        const descriptionFilm =
            document.getElementById("descriptionFilm");
        const videoContainer =
            document.getElementById("videoContainer");
        const messageVideo =
            document.getElementById("messageVideo");
        const boutonRegarder =
            document.getElementById("boutonRegarder");
        const boutonFavori =
            document.getElementById("boutonFavori");
        const boutonRetour =
            document.getElementById("boutonRetour");
        /* ======================================
           OUTILS DE RÉCUPÉRATION DES DONNÉES
        ====================================== */
        function lireJSON(cle, valeurParDefaut) {
            try {
                const valeur = localStorage.getItem(cle);
                if (!valeur) {
                    return valeurParDefaut;
                }
                return JSON.parse(valeur);
            } catch (erreur) {
                return valeurParDefaut;
            }
        }
        function obtenirFilms() {
            const filmsSauvegardes =
                lireJSON("mobilusFilms", null);
            if (Array.isArray(filmsSauvegardes)) {
                return filmsSauvegardes;
            }
            if (window.films && Array.isArray(window.films)) {
                return window.films;
            }
            if (
                window.films &&
                Array.isArray(window.films.films)
            ) {
                return window.films.films;
            }
            return [];
        }
        function obtenirIdentifiant(film) {
            return String(
                film.id ??
                film.identifiant ??
                film.filmId ??
                ""
            );
        }
        function obtenirTitre(film) {
            return (
                film.titre ||
                film.title ||
                film.nom ||
                film.name ||
                "Film sans titre"
            );
        }
        function obtenirDescription(film) {
            return (
                film.description ||
                film.synopsis ||
                film.resume ||
                film.resumé ||
                "Aucune description disponible."
            );
        }
        function obtenirVideo(film) {
            return (
                film.video ||
                film.videoUrl ||
                film.videoURL ||
                film.urlVideo ||
                film.lienVideo ||
                film.url ||
                film.source ||
                ""
            );
        }
        function obtenirPoster(film) {
            return (
                film.poster ||
                film.affiche ||
                film.image ||
                film.imageUrl ||
                film.thumbnail ||
                ""
            );
        }
        /* ======================================
           CHOISIR LE FILM
        ====================================== */
        const parametres =
            new URLSearchParams(window.location.search);
        const identifiantURL = parametres.get("id");
        const filmSelectionne =
            lireJSON("mobilusFilmSelectionne", null);
        const catalogue = obtenirFilms();
        let filmActuel = null;
        if (identifiantURL !== null) {
            filmActuel = catalogue.find(function (film) {
                return obtenirIdentifiant(film) ===
                    String(identifiantURL);
            }) || null;
        }
        if (!filmActuel && filmSelectionne) {
            const identifiantSelectionne =
                obtenirIdentifiant(filmSelectionne);
            filmActuel = catalogue.find(function (film) {
                return obtenirIdentifiant(film) ===
                    identifiantSelectionne;
            }) || filmSelectionne;
        }
        /* ======================================
           AFFICHER LES INFORMATIONS
        ====================================== */
        function afficherErreur(message) {
            titreFilm.textContent = "Film introuvable";
            descriptionFilm.textContent = message;
            messageVideo.textContent = message;
            messageVideo.classList.remove("cache");
            boutonRegarder.disabled = true;
            boutonFavori.disabled = true;
        }
        if (!filmActuel) {
            afficherErreur(
                "Ce film est introuvable. " +
                "Retournez à l'accueil et sélectionnez un film."
            );
            return;
        }
        titreFilm.textContent = obtenirTitre(filmActuel);
        anneeFilm.textContent =
            filmActuel.annee ||
            filmActuel.year ||
            "Année inconnue";
        categorieFilm.textContent =
            filmActuel.categorie ||
            filmActuel.category ||
            filmActuel.genre ||
            "Film";
        dureeFilm.textContent =
            filmActuel.duree ||
            filmActuel.duration ||
            "Durée inconnue";
        descriptionFilm.textContent =
            obtenirDescription(filmActuel);
        document.title =
            obtenirTitre(filmActuel) + " | MOBILUS";
        /* ======================================
           AFFICHER L'AFFICHE EN ARRIÈRE-PLAN
        ====================================== */
        const poster = obtenirPoster(filmActuel);
        if (poster) {
            videoContainer.style.backgroundImage =
                "url('" +
                String(poster).replace(/'/g, "%27") +
                "')";
            videoContainer.style.backgroundSize = "cover";
            videoContainer.style.backgroundPosition = "center";
        }
        /* ======================================
           LECTEUR VIDÉO
        ====================================== */
        function afficherMessageVideo(message) {
            messageVideo.textContent = message;
            messageVideo.classList.remove("cache");
        }
        function masquerMessageVideo() {
            messageVideo.classList.add("cache");
        }
        function estLienYouTube(url) {
            return /youtube\.com|youtu\.be/i.test(url);
        }
        function estLienVimeo(url) {
            return /vimeo\.com/i.test(url);
        }
        function convertirLienYouTube(url) {
            let identifiant = "";
            try {
                const adresse = new URL(url);
                if (adresse.hostname.includes("youtu.be")) {
                    identifiant =
                        adresse.pathname.split("/").filter(Boolean)[0] || "";
                } else if (
                    adresse.pathname.startsWith("/embed/")
                ) {
                    identifiant =
                        adresse.pathname.split("/")[2] || "";
                } else if (
                    adresse.pathname.startsWith("/shorts/")
                ) {
                    identifiant =
                        adresse.pathname.split("/")[2] || "";
                } else {
                    identifiant =
                        adresse.searchParams.get("v") || "";
                }
            } catch (erreur) {
                return "";
            }
            if (!/^[a-zA-Z0-9_-]{6,20}$/.test(identifiant)) {
                return "";
            }
            return (
                "https://www.youtube.com/embed/" +
                identifiant +
                "?autoplay=1&rel=0"
            );
        }
        function convertirLienVimeo(url) {
            const correspondance =
                url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
            if (!correspondance) {
                return "";
            }
            return (
                "https://player.vimeo.com/video/" +
                correspondance[1] +
                "?autoplay=1"
            );
        }
        function regarderFilm() {
            const url = obtenirVideo(filmActuel);
            if (!url) {
                afficherMessageVideo(
                    "Aucune vidéo n'est configurée pour ce film."
                );
                return;
            }
            masquerMessageVideo();
            const ancienneVideo =
                videoContainer.querySelector("video, iframe");
            if (ancienneVideo) {
                ancienneVideo.remove();
            }
            if (estLienYouTube(url) || estLienVimeo(url)) {
                const lienIntegre = estLienYouTube(url)
                    ? convertirLienYouTube(url)
                    : convertirLienVimeo(url);
                if (!lienIntegre) {
                    afficherMessageVideo(
                        "Le lien vidéo n'est pas valide."
                    );
                    return;
                }
                const iframe = document.createElement("iframe");
                iframe.src = lienIntegre;
                iframe.title = obtenirTitre(filmActuel);
                iframe.allow =
                    "autoplay; encrypted-media; picture-in-picture; fullscreen";
                iframe.allowFullscreen = true;
                iframe.referrerPolicy =
                    "strict-origin-when-cross-origin";
                videoContainer.appendChild(iframe);
                return;
            }
            const video = document.createElement("video");
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.src = url;
            video.addEventListener("error", function () {
                afficherMessageVideo(
                    "Impossible de lire cette vidéo. " +
                    "Vérifiez que le lien est valide et accessible."
                );
            });
            videoContainer.appendChild(video);
            video.play().catch(function () {
                /* Le navigateur peut demander un clic pour démarrer. */
            });
        }
        boutonRegarder.addEventListener(
            "click",
            regarderFilm
        );
        /* ======================================
           FAVORIS
        ====================================== */
        function obtenirFavoris() {
            const favoris = lireJSON("mobilusFavoris", []);
            return Array.isArray(favoris) ? favoris : [];
        }
        function filmEstFavori() {
            const favoris = obtenirFavoris();
            return favoris.some(function (favori) {
                if (typeof favori === "object" && favori !== null) {
                    return obtenirIdentifiant(favori) ===
                        obtenirIdentifiant(filmActuel);
                }
                return String(favori) ===
                    obtenirIdentifiant(filmActuel);
            });
        }
        function actualiserBoutonFavori() {
            if (filmEstFavori()) {
                boutonFavori.textContent =
                    "♥ Retirer des favoris";
                boutonFavori.classList.add("actif");
            } else {
                boutonFavori.textContent =
                    "♡ Ajouter aux favoris";
                boutonFavori.classList.remove("actif");
            }
        }
        boutonFavori.addEventListener("click", function () {
            let favoris = obtenirFavoris();
            const idFilm = obtenirIdentifiant(filmActuel);
            if (filmEstFavori()) {
                favoris = favoris.filter(function (favori) {
                    if (
                        typeof favori === "object" &&
                        favori !== null
                    ) {
                        return obtenirIdentifiant(favori) !== idFilm;
                    }
                    return String(favori) !== idFilm;
                });
            } else {
                favoris.push(filmActuel);
            }
            try {
                localStorage.setItem(
                    "mobilusFavoris",
                    JSON.stringify(favoris)
                );
                actualiserBoutonFavori();
            } catch (erreur) {
                alert(
                    "Impossible de sauvegarder les favoris sur cet appareil."
                );
            }
        });
        actualiserBoutonFavori();
        /* ======================================
           RETOUR À LA PAGE PRÉCÉDENTE
        ====================================== */
        boutonRetour.addEventListener("click", function () {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        });
    })();
    </script>
</body>
</html>
