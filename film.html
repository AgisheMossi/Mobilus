<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="Regardez vos films sur MOBILUS.">
    <title>Film | MOBILUS</title>
<style>
    :root {
        --fond: #090909;
        --fond-secondaire: #151515;
        --rouge: #e50914;
        --jaune: #ffd400;
        --blanc: #ffffff;
        --gris: #aaaaaa;
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--fond);
        color: var(--blanc);
        min-height: 100vh;
    }
    body.chargement-actif {
        overflow: hidden;
    }
    button {
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .ecran-chargement {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #090909;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .ecran-chargement.termine {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
    .cercle-chargement {
        width: 48px;
        height: 48px;
        border: 4px solid #333333;
        border-top-color: var(--jaune);
        border-radius: 50%;
        animation: tourner 0.8s linear infinite;
    }
    @keyframes tourner {
        to {
            transform: rotate(360deg);
        }
    }
    .entete {
        width: 100%;
        min-height: 65px;
        padding: 14px 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: #090909;
        border-bottom: 1px solid #242424;
    }
    .logo {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
    }
    .lettre-rouge {
        color: var(--rouge);
    }
    .bouton-retour {
        border: 1px solid #393939;
        background: #191919;
        color: white;
        padding: 10px 15px;
        border-radius: 7px;
        font-size: 14px;
    }
    .conteneur {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 25px 18px 45px;
    }
    .etiquette {
        display: inline-block;
        color: var(--jaune);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }
    .titre-principal {
        font-size: 28px;
        line-height: 1.3;
        margin-bottom: 12px;
        overflow-wrap: anywhere;
    }
    .informations {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--gris);
        font-size: 13px;
        margin-bottom: 22px;
    }
    .informations span {
        background: #191919;
        padding: 6px 9px;
        border-radius: 5px;
    }
    .lecteur {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000000;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        border: 1px solid #252525;
        margin-bottom: 25px;
    }
    .lecteur iframe,
    .lecteur video {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #000000;
    }
    .lecteur video {
        object-fit: contain;
    }
    .message-video {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        color: #bbbbbb;
        font-size: 14px;
        line-height: 1.6;
        background: #000000;
    }
    .message-video.cache {
        display: none;
    }
    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 30px;
    }
    .bouton-principal,
    .bouton-favori {
        min-height: 46px;
        padding: 12px 18px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: bold;
        border: none;
    }
    .bouton-principal {
        background: var(--rouge);
        color: white;
    }
    .bouton-favori {
        background: #242424;
        color: white;
        border: 1px solid #393939;
    }
    .bouton-favori.actif {
        border-color: var(--jaune);
        color: var(--jaune);
    }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .bloc-description {
        background: var(--fond-secondaire);
        border: 1px solid #242424;
        border-radius: 10px;
        padding: 20px;
    }
    .bloc-description h2 {
        font-size: 19px;
        margin-bottom: 12px;
    }
    .description {
        font-size: 14px;
        line-height: 1.8;
        color: #c5c5c5;
        white-space: pre-line;
        overflow-wrap: anywhere;
    }
    footer {
        text-align: center;
        color: #777777;
        padding: 25px 15px;
        font-size: 12px;
        border-top: 1px solid #222222;
    }
    @media (min-width: 700px) {
        .conteneur {
            padding-top: 35px;
        }
        .titre-principal {
            font-size: 36px;
        }
    }
    @media (prefers-reduced-motion: reduce) {
        .cercle-chargement {
            animation: none;
        }
        .ecran-chargement {
            transition: none;
        }
    }
</style>
</head>
<body class="chargement-actif">
<div class="ecran-chargement" id="ecranChargement">
    <div class="cercle-chargement"></div>
</div>
<header class="entete">
    <a href="index.html" class="logo" aria-label="Accueil MOBILUS">
        M<span class="lettre-rouge">O</span>BILUS
    </a>
<button type="button" class="bouton-retour" id="boutonRetour">
    ← Retour
</button>
</header>
<main class="conteneur">
<span class="etiquette">TON UNIVERS CINÉMA</span>
<h1 class="titre-principal" id="titreFilm">
    Chargement du film...
</h1>
<div class="informations">
    <span id="anneeFilm">Année inconnue</span>
    <span id="categorieFilm">Film</span>
    <span id="dureeFilm">Durée inconnue</span>
</div>
<section class="lecteur" id="videoContainer" aria-label="Lecteur vidéo">
    <div class="message-video" id="messageVideo">
        Préparation de la vidéo...
    </div>
</section>
<div class="actions">
    <button type="button" class="bouton-principal" id="boutonRegarder">
        ▶ Regarder le film
    </button>
    <button type="button" class="bouton-favori" id="boutonFavori">
        ♡ Ajouter aux favoris
    </button>
</div>
<section class="bloc-description">
    <h2>À propos du film</h2>
    <p class="description" id="descriptionFilm">
        Aucune description disponible.
    </p>
</section>
</main>
<footer>
    © <span id="anneeActuelle"></span> MOBILUS —
    YOUR CINEMA, EVERYWHERE
</footer>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="films.js"></script>
<script>
(function () {
    "use strict";
    const CLE_FAVORIS = "mobilusFavoris";
    const CLE_RECENTS = "mobilusRecents";
    const elements = {
        titre: document.getElementById("titreFilm"),
        annee: document.getElementById("anneeFilm"),
        categorie: document.getElementById("categorieFilm"),
        duree: document.getElementById("dureeFilm"),
        description: document.getElementById("descriptionFilm"),
        lecteur: document.getElementById("videoContainer"),
        message: document.getElementById("messageVideo"),
        regarder: document.getElementById("boutonRegarder"),
        favori: document.getElementById("boutonFavori"),
        retour: document.getElementById("boutonRetour"),
        chargement: document.getElementById("ecranChargement")
    };
    document.getElementById("anneeActuelle").textContent =
        new Date().getFullYear();
    let filmActuel = null;
    let urlVideoActuelle = "";
    let chargementTermine = false;
    function terminerChargement() {
        if (chargementTermine) return;
        chargementTermine = true;
        elements.chargement.classList.add("termine");
        document.body.classList.remove("chargement-actif");
        setTimeout(function () {
            elements.chargement.remove();
        }, 350);
    }
    setTimeout(terminerChargement, 12000);
    function lireJSON(cle, valeurParDefaut) {
        try {
            const valeur = localStorage.getItem(cle);
            return valeur ? JSON.parse(valeur) : valeurParDefaut;
        } catch (erreur) {
            return valeurParDefaut;
        }
    }
    function obtenirIdentifiant(film) {
        return String(
            film.id ??
            film.identifiant ??
            film.filmId ??
            ""
        );
    }
    function obtenirTitre(film) {
        return film.titre ||
            film.title ||
            film.nom ||
            film.name ||
            "Film sans titre";
    }
    function obtenirDescription(film) {
        return film.description ||
            film.synopsis ||
            film.resume ||
            "Aucune description disponible.";
    }
    function obtenirVideo(film) {
        return film.video_url ||
            film.video ||
            film.videoUrl ||
            film.videoURL ||
            film.urlVideo ||
            film.lienVideo ||
            film.url ||
            film.source ||
            "";
    }
    function afficherMessageVideo(message) {
        elements.message.textContent = message;
        elements.message.classList.remove("cache");
    }
    function masquerMessageVideo() {
        elements.message.classList.add("cache");
    }
    function afficherErreur(message) {
        elements.titre.textContent = "Contenu indisponible";
        elements.description.textContent = message;
        afficherMessageVideo(message);
        elements.regarder.disabled = true;
        elements.favori.disabled = true;
    }
    function normaliserContenu(contenu) {
        return {
            ...contenu,
            id: contenu.id,
            title: contenu.titre,
            year: contenu.annee,
            category: contenu.categorie,
            type: contenu.type,
            image: contenu.image_url,
            video_url: contenu.video_url,
            description: contenu.description,
            duree: contenu.duree,
            niveau_acces: contenu.niveau_acces || "gratuit"
        };
    }
    async function chargerContenu() {
        const parametres = new URLSearchParams(location.search);
        const identifiantURL = parametres.get("id");
        if (!identifiantURL) {
            afficherErreur(
                "Identifiant du contenu absent. Retournez à l'accueil et sélectionnez un film."
            );
            terminerChargement();
            return;
        }
        const db = window.mobilusDB;
        if (!db) {
            afficherErreur(
                "Connexion à Supabase impossible. Vérifiez votre connexion Internet."
            );
            terminerChargement();
            return;
        }
        try {
            const sessionResultat = await db.auth.getSession();
            if (sessionResultat.error) {
                throw sessionResultat.error;
            }
            const session = sessionResultat.data.session;
            if (!session) {
                location.replace("connexion.html");
                return;
            }
            const resultat = await db
                .from("contenus")
                .select("*")
                .eq("id", identifiantURL)
                .eq("publie", true)
                .maybeSingle();
            if (resultat.error) {
                throw resultat.error;
            }
            if (!resultat.data) {
                afficherErreur(
                    "Ce contenu est introuvable ou n'est pas encore publié."
                );
                terminerChargement();
                return;
            }
            filmActuel = normaliserContenu(resultat.data);
            afficherInformations();
            enregistrerRecent();
            actualiserBoutonFavori();
            afficherMessageVideo(
                "Appuyez sur « Regarder le film » pour lancer la vidéo."
            );
            terminerChargement();
        } catch (erreur) {
            console.error("Erreur chargement MOBILUS :", erreur);
            afficherErreur(
                "Impossible de charger ce contenu. Vérifiez votre connexion ou reconnectez-vous."
            );
            terminerChargement();
        }
    }
    function afficherInformations() {
        const titre = obtenirTitre(filmActuel);
        elements.titre.textContent = titre;
        elements.annee.textContent =
            filmActuel.year || "Année inconnue";
        elements.categorie.textContent =
            filmActuel.category || filmActuel.type || "Film";
        elements.duree.textContent =
            filmActuel.duree || "Durée inconnue";
        elements.description.textContent =
            obtenirDescription(filmActuel);
        document.title = titre + " | MOBILUS";
    }
    /* HISTORIQUE */
    function enregistrerRecent() {
        const idFilm = obtenirIdentifiant(filmActuel);
        let recents = lireJSON(CLE_RECENTS, []);
        if (!Array.isArray(recents)) {
            recents = [];
        }
        recents = recents.filter(function (element) {
            return String(element.id) !== idFilm;
        });
        recents.unshift({
            id: filmActuel.id,
            title: obtenirTitre(filmActuel),
            year: filmActuel.year || "",
            category: filmActuel.category || "",
            type: filmActuel.type || "film",
            image: filmActuel.image || "",
            date: new Date().toISOString()
        });
        try {
            localStorage.setItem(
                CLE_RECENTS,
                JSON.stringify(recents.slice(0, 50))
            );
        } catch (erreur) {
            console.error("Erreur historique MOBILUS :", erreur);
        }
    }
    /* FAVORIS */
    function obtenirFavoris() {
        const favoris = lireJSON(CLE_FAVORIS, []);
        return Array.isArray(favoris) ? favoris : [];
    }
    function estFavori() {
        const idFilm = obtenirIdentifiant(filmActuel);
        return obtenirFavoris().some(function (favori) {
            const id = typeof favori === "object" && favori !== null
                ? obtenirIdentifiant(favori)
                : String(favori);
            return id === idFilm;
        });
    }
    function actualiserBoutonFavori() {
        if (estFavori()) {
            elements.favori.textContent = "♥ Retirer des favoris";
            elements.favori.classList.add("actif");
        } else {
            elements.favori.textContent = "♡ Ajouter aux favoris";
            elements.favori.classList.remove("actif");
        }
    }
    elements.favori.addEventListener("click", function () {
        if (!filmActuel) return;
        let favoris = obtenirFavoris();
        const idFilm = obtenirIdentifiant(filmActuel);
        if (estFavori()) {
            favoris = favoris.filter(function (favori) {
                const id = typeof favori === "object" && favori !== null
                    ? obtenirIdentifiant(favori)
                    : String(favori);
                return id !== idFilm;
            });
        } else {
            favoris.push(filmActuel.id);
        }
        try {
            localStorage.setItem(
                CLE_FAVORIS,
                JSON.stringify(favoris)
            );
            actualiserBoutonFavori();
        } catch (erreur) {
            alert("Impossible de sauvegarder les favoris.");
        }
    });
    /* YOUTUBE ET VIMEO */
    function convertirYouTube(url) {
        try {
            const adresse = new URL(url);
            let id = "";
            if (adresse.hostname.includes("youtu.be")) {
                id = adresse.pathname.split("/").filter(Boolean)[0] || "";
            } else if (adresse.pathname.startsWith("/embed/")) {
                id = adresse.pathname.split("/")[2] || "";
            } else if (adresse.pathname.startsWith("/shorts/")) {
                id = adresse.pathname.split("/")[2] || "";
            } else {
                id = adresse.searchParams.get("v") || "";
            }
            if (!/^[a-zA-Z0-9_-]{6,20}$/.test(id)) {
                return "";
            }
            return "https://www.youtube.com/embed/" +
                id + "?autoplay=1&rel=0";
        } catch (erreur) {
            return "";
        }
    }
    function convertirVimeo(url) {
        const resultat = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
        if (!resultat) return "";
        return "https://player.vimeo.com/video/" +
            resultat[1] + "?autoplay=1";
    }
    function supprimerAncienneVideo() {
        const ancienneVideo =
            elements.lecteur.querySelector("video, iframe");
        if (ancienneVideo) {
            if (ancienneVideo.tagName === "VIDEO") {
                ancienneVideo.pause();
                ancienneVideo.removeAttribute("src");
                ancienneVideo.load();
            }
            ancienneVideo.remove();
        }
    }
    function afficherLecteur(url, titre) {
        supprimerAncienneVideo();
        if (/youtube\.com|youtu\.be/i.test(url)) {
            const lien = convertirYouTube(url);
            if (!lien) {
                afficherMessageVideo("Le lien YouTube est invalide.");
                return;
            }
            const iframe = document.createElement("iframe");
            iframe.src = lien;
            iframe.title = titre;
            iframe.allow =
                "autoplay; encrypted-media; picture-in-picture; fullscreen";
            iframe.allowFullscreen = true;
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            elements.lecteur.appendChild(iframe);
            masquerMessageVideo();
            return;
        }
        if (/vimeo\.com/i.test(url)) {
            const lien = convertirVimeo(url);
            if (!lien) {
                afficherMessageVideo("Le lien Vimeo est invalide.");
                return;
            }
            const iframe = document.createElement("iframe");
            iframe.src = lien;
            iframe.title = titre;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.allowFullscreen = true;
            elements.lecteur.appendChild(iframe);
            masquerMessageVideo();
            return;
        }
        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.src = url;
        video.addEventListener("error", function () {
            afficherMessageVideo(
                "Impossible de lire cette vidéo. Vérifiez que le fichier est accessible."
            );
        });
        elements.lecteur.appendChild(video);
        masquerMessageVideo();
        video.play().catch(function () {
            // Certains navigateurs exigent une action supplémentaire.
        });
    }
    /* LECTURE SÉCURISÉE */
    async function regarderFilm() {
        if (!filmActuel) return;
        elements.regarder.disabled = true;
        elements.regarder.textContent = "Chargement...";
        try {
            const url = obtenirVideo(filmActuel);
            if (!url) {
                afficherMessageVideo(
                    "Aucune vidéo n'est configurée pour ce contenu."
                );
                return;
            }
            const db = window.mobilusDB;
            if (!db) {
                throw new Error("Connexion Supabase indisponible.");
            }
            const sessionResultat = await db.auth.getSession();
            if (sessionResultat.error || !sessionResultat.data.session) {
                location.replace("connexion.html");
                return;
            }
            let urlFinale = url;
            /*
             * Les vidéos du stockage privé passent obligatoirement
             * par la fonction Edge obtenir-video.
             */
            if (url.startsWith("mobilus-videos/")) {
                const resultat = await db.functions.invoke(
                    "obtenir-video",
                    {
                        body: {
                            contenu_id: filmActuel.id
                        }
                    }
                );
                if (resultat.error) {
                    throw resultat.error;
                }
                if (!resultat.data || !resultat.data.video_url) {
                    throw new Error(
                        "Le serveur n'a pas fourni de lien vidéo."
                    );
                }
                urlFinale = resultat.data.video_url;
            }
            /*
             * Une vidéo Premium ne doit pas être diffusée
             * depuis un lien externe non protégé.
             */
            if (
                filmActuel.niveau_acces === "premium" &&
                !url.startsWith("mobilus-videos/")
            ) {
                throw new Error(
                    "Cette vidéo Premium doit être stockée dans le stockage privé MOBILUS."
                );
            }
            urlVideoActuelle = urlFinale;
            afficherLecteur(
                urlVideoActuelle,
                obtenirTitre(filmActuel)
            );
        } catch (erreur) {
            console.error("Erreur lecture vidéo :", erreur);
            afficherMessageVideo(
                erreur.message ||
                "Impossible de lancer cette vidéo. Vérifiez votre abonnement ou réessayez."
            );
        } finally {
            elements.regarder.disabled = false;
            elements.regarder.textContent = "▶ Regarder le film";
        }
    }
    elements.regarder.addEventListener("click", regarderFilm);
    /* RETOUR */
    elements.retour.addEventListener("click", function () {
        if (
            document.referrer &&
            new URL(document.referrer).origin === location.origin
        ) {
            history.back();
        } else {
            location.href = "index.html";
        }
    });
    /* DÉMARRAGE */
    chargerContenu();
})();
</script>
</body>
</html>
