name: Deploy MOBILUS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Préparer les fichiers MOBILUS
        run: |
          mkdir -p extracted public
          unzip -q mobilus.zip -d extracted
          INDEX_PATH=$(find extracted -name index.html -type f | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "Erreur : index.html introuvable dans mobilus.zip"
            exit 1
          fi
          SITE_DIR=$(dirname "$INDEX_PATH")
          cp -R "$SITE_DIR"/. public/

      - name: Configurer Firebase
        run: |
          echo '{"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"]}}' > firebase.json

      - name: Publier MOBILUS
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mobilus-e3553
          channelId: live
