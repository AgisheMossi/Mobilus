name: Déploiement MOBILUS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers MOBILUS
        uses: actions/checkout@v4

      - name: Préparer Firebase
        run: |
          echo '{
            "hosting": {
              "public": ".",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**",
                "mobilus.zip",
                "MOBILUS_Animation/**"
              ]
            }
          }' > firebase.json

      - name: Publier MOBILUS
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mobilus-e3553
          channelId: live
